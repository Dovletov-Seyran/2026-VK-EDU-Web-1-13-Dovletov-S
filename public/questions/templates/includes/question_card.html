<div class="question-card">
    <div class="d-flex gap-3 align-items-start">
        <div class="vote-box flex-shrink-0">
            <button>▲</button>
            <span>{{ question.likes_count }}</span>
            <button>▼</button>
        </div>
        <div class="q-avatar flex-shrink-0">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7EBFBF" stroke-width="1.5">
                <rect x="2" y="2" width="20" height="20" rx="2" />
                <line x1="2" y1="2" x2="22" y2="22" />
                <line x1="22" y1="2" x2="2" y2="22" />
            </svg>
        </div>
        <div class="flex-grow-1">
            <a href="{% url 'questions:question' question.id%}" class="q-title">{{ question.title }}</a>
            <p class="q-text">{{ question.text }}</p>
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <a href="#" class="answer-link">answer ({{ question.answers.count }})</a>
                <span class="tags-label">Tags:</span>
                {% for tag in question.tags.all %}
                <a href="{% url 'questions:tag' tag.slug %}" class="tag-link">{{ tag.title }}</a>
                {% endfor %}
                <span class="q-time">asked {{ question.publish_at|timesince }} ago</span>
            </div>
        </div>
    </div>
</div>
