services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./media:/app/media
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: edu_user
      POSTGRES_PASSWORD: "12345"
      POSTGRES_DB: edu_web
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U edu_user -d edu_web" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
