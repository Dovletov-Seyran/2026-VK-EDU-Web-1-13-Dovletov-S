{% extends 'base.html' %}
{% block title %}AskPupkin — Registration{% endblock %}

{% block content %}
<h4 class="page-title">Registration</h4>
<div class="form-error">
  Sorry, this email address already registered!
</div>
<div class="white-card">
  <form method="post" action="#" enctype="multipart/form-data">
    <div class="row align-items-start mb-3 g-2">
      <div class="col-auto form-label-col">Login</div>
      <div class="col">
        <input class="field" type="text" name="username" value="dr_pepper" />
      </div>
    </div>
    <div class="row align-items-start mb-3 g-2">
      <div class="col-auto form-label-col">Email</div>
      <div class="col">
        <input class="field" type="email" name="email" value="dr.pepper@mail.ru" />
      </div>
    </div>
    <div class="row align-items-start mb-3 g-2">
      <div class="col-auto form-label-col">NickName</div>
      <div class="col">
        <input class="field" type="text" name="nickname" value="Dr. Pepper" />
      </div>
    </div>
    <div class="row align-items-start mb-3 g-2">
      <div class="col-auto form-label-col">Password</div>
      <div class="col">
        <input class="field" type="password" name="password" value="••••••••" />
      </div>
    </div>
    <div class="row align-items-start mb-3 g-2">
      <div class="col-auto form-label-col">Repeat password</div>
      <div class="col">
        <input class="field" type="password" name="password2" value="••••••••" />
      </div>
    </div>
    <div class="row align-items-start mb-3 g-2">
      <div class="col-auto form-label-col">Upload avatar</div>
      <div class="col">
        <div class="avatar-preview">
          <svg
            width="44"
            height="44"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#7EBFBF"
            stroke-width="1.2"
          >
            <rect x="2" y="2" width="20" height="20" rx="2" />
            <line x1="2" y1="2" x2="22" y2="22" />
            <line x1="22" y1="2" x2="2" y2="22" />
          </svg>
        </div>
        <div class="d-flex gap-2 align-items-center">
          <span class="file-label" id="file-label">c:\avatar.jpg</span>
          <label
            for="avatar-input"
            class="btn-main"
            style="padding: 5px 14px; font-size: 13px; cursor: pointer; margin: 0;"
          >choose</label>
          <input
            id="avatar-input"
            type="file"
            name="avatar"
            accept="image/*"
            style="display: none"
            onchange="
              document.getElementById('file-label').textContent =
                this.files[0]?.name || 'c:\\avatar.jpg'
            "
          />
        </div>
      </div>
    </div>
    <div class="row g-2">
      <div class="col-auto form-label-col"></div>
      <div class="col">
        <button type="submit" class="btn-main">Register!</button>
      </div>
    </div>
  </form>
</div>
{% endblock %}
