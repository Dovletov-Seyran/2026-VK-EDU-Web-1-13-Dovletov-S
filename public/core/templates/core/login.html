{% extends 'base.html' %}
{% block title %}AskPupkin — Log In{% endblock %}

{% block content %}
<h4 class="page-title">Log In</h4>
<div class="form-error">
  Sorry, wrong password!
</div>
<div class="white-card">
  <form method="post" action="#">
    <div class="row align-items-start mb-3 g-2">
      <div class="col-auto form-label-col">Login</div>
      <div class="col">
        <input class="field" type="text" name="username" placeholder="Enter your login here" />
      </div>
    </div>
    <div class="row align-items-start mb-3 g-2">
      <div class="col-auto form-label-col">Password</div>
      <div class="col">
        <input class="field" type="password" name="password" value="••••••••" />
      </div>
    </div>
    <div class="row g-2">
      <div class="col-auto form-label-col"></div>
      <div class="col d-flex flex-column gap-2">
        <div>
          <button type="submit" class="btn-main">Log in!</button>
        </div>
        <a href="#" class="answer-link">create new account</a>
      </div>
    </div>
  </form>
</div>
{% endblock %}
